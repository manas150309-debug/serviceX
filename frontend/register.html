<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SERVEX PRO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">SERVEX PRO</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-box">
            <h2>Register</h2>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="customer-tab">As Customer</button>
                <button class="tab-btn" id="provider-tab">As Provider</button>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <!-- Customer/Provider specific fields -->
                <div id="customer-fields">
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                </div>

                <div id="provider-fields" style="display: none;">
                    <div class="form-group">
                        <label for="service-type">Service Type</label>
                        <select id="service-type" name="service-type">
                            <option value="plumber">Plumber</option>
                            <option value="electrician">Electrician</option>
                            <option value="tutor">Tutor</option>
                            <option value="mechanic">Mechanic</option>
                            <option value="cleaner">Cleaner</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="experience">Years of Experience</label>
                        <input type="number" id="experience" name="experience" min="0">
                    </div>

                    <div class="form-group">
                        <label for="hourly-rate">Hourly Rate</label>
                        <input type="number" id="hourly-rate" name="hourly-rate" min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register</button>

                <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
            </form>

            <div id="error-message" class="error-message"></div>
        </div>
    </section>

    <script src="js/auth.js"></script>
</body>
</html>
