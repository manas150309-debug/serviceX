<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SERVEX PRO</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">SERVEX PRO</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-container">
        <div class="auth-box">
            <h2>Login</h2>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="customer-tab">As Customer</button>
                <button class="tab-btn" id="provider-tab">As Provider</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>

                <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
            </form>

            <div id="error-message" class="error-message"></div>
        </div>
    </section>

    <script src="js/auth.js"></script>
</body>
</html>
