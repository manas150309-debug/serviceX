<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SERVEX PRO</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">SERVEX PRO</div>
            <ul class="nav-links">
                <li><span id="user-name">User</span></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" onclick="showTab('bookings')" class="menu-item active">My Bookings</a></li>
                <li><a href="#" onclick="showTab('find-service')" class="menu-item">Find Service</a></li>
                <li><a href="#" onclick="showTab('profile')" class="menu-item">Profile</a></li>
                <li><a href="#" onclick="showTab('ratings')" class="menu-item">Ratings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <!-- My Bookings Tab -->
            <div id="bookings-tab" class="tab-content active">
                <h2>My Bookings</h2>
                <div id="bookings-list" class="bookings-list">
                    <p>Loading bookings...</p>
                </div>
            </div>

            <!-- Find Service Tab -->
            <div id="find-service-tab" class="tab-content">
                <h2>Find a Service</h2>
                <form id="search-form" class="search-form">
                    <div class="form-group">
                        <label for="service-type">Service Type</label>
                        <select id="service-type" name="service-type" required>
                            <option value="plumber">Plumber</option>
                            <option value="electrician">Electrician</option>
                            <option value="tutor">Tutor</option>
                            <option value="mechanic">Mechanic</option>
                            <option value="cleaner">Cleaner</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="date">Scheduled Date</label>
                        <input type="datetime-local" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="hours">Estimated Hours</label>
                        <input type="number" id="hours" name="hours" min="0.5" step="0.5" value="1" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Find Providers</button>
                </form>

                <div id="providers-list" class="providers-list" style="display: none;"></div>
            </div>

            <!-- Profile Tab -->
            <div id="profile-tab" class="tab-content">
                <h2>My Profile</h2>
                <form id="profile-form" class="profile-form">
                    <div class="form-group">
                        <label for="profile-name">Name</label>
                        <input type="text" id="profile-name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="profile-phone">Phone</label>
                        <input type="tel" id="profile-phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="profile-address">Address</label>
                        <input type="text" id="profile-address" name="address" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>

            <!-- Ratings Tab -->
            <div id="ratings-tab" class="tab-content">
                <h2>My Ratings</h2>
                <div id="ratings-list" class="ratings-list">
                    <p>Loading ratings...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
